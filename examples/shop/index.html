<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lumen: i18n-anything demo</title>
<style>
  :root { --ink:#1d1d1b; --muted:#6b6a65; --line:#ebe9e3; --bg:#f6f5f1; --card:#fff; --accent:#2a78d6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Noto Sans CJK JP", "DejaVu Sans", sans-serif; }
  #app { width: 380px; margin: 18px auto; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
  .brand { font-size:17px; letter-spacing:.02em; }
  nav { display:flex; gap:14px; font-size:13.5px; color:var(--muted); white-space:nowrap; }
  .hello { margin:0 0 10px; color:var(--muted); font-size:14px; }
  .cart { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  h1 { font-size:19px; margin:0; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:7px 0; font-size:14.5px; }
  .head { padding-top:0; }
  .count { color:var(--muted); font-size:13.5px; white-space:nowrap; }
  .item { border-top:1px solid var(--line); padding:10px 0; justify-content:flex-start; }
  .swatch { width:38px; height:38px; border-radius:9px; flex:none; background:hsl(var(--h) 55% 80%); }
  .name { flex:1; display:flex; flex-direction:column; min-width:0; }
  .name small { color:var(--muted); font-size:12.5px; }
  .name small a { color:var(--accent); }
  .price { font-variant-numeric: tabular-nums; white-space:nowrap; }
  .promo { display:flex; gap:8px; margin:6px 0 8px; padding-top:12px; border-top:1px solid var(--line); }
  input { flex:1; min-width:0; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:9px; }
  button { font:inherit; border-radius:10px; padding:8px 12px; border:1px solid var(--line); background:#fff; }
  .total { font-weight:650; font-size:16px; border-top:1px solid var(--line); padding-top:10px; margin-top:2px; }
  .eta { margin:2px 0 12px; color:#2f7d4f; font-size:13.5px; }
  .badge { margin:0 0 12px; font-size:13px; background:#fff6dd; border-radius:8px; padding:6px 10px; }
  .primary { width:100%; background:var(--ink); color:#fff; border:0; padding:11px; font-weight:600; }
  footer { margin-top:10px; font-size:12.5px; color:var(--muted); text-align:center; }
  footer a, nav a { text-decoration:underline; text-underline-offset:2px; }
</style>
</head>
<body>
<main id="app"></main>
<script type="module" src="app.js"></script>
</body>
</html>
